name: Production (Hostinger)

# Déploiement de www.aymericpataud.fr sur l'hébergement Hostinger.
#
# Le domaine reste enregistré chez OVH et sa zone DNS aussi. Seuls les
# enregistrements A du domaine nu et de www pointent vers Hostinger. Les MX,
# le SPF et tout ce qui concerne la messagerie restent chez OVH, intacts :
# le site et les mails sont deux enregistrements séparés de la même zone.
#
# Retour arrière : remettre l'ancienne IP dans les deux enregistrements A.
# Le WordPress reste en place chez OVH, il n'est jamais écrasé.
#
# ---------------------------------------------------------------------------
# ACTIVATION (une seule fois, dans Settings > Secrets and variables > Actions)
#
# Secrets (Hostinger > hPanel > Fichiers > Comptes FTP) :
#   FTP_SERVER     ex. ftp.aymericpataud.fr ou l'hôte donné par hPanel
#   FTP_USERNAME
#   FTP_PASSWORD
#
# Variables :
#   DEPLOY_FTP     true
#   FTP_DIR        dossier cible, avec / final.
#
# ATTENTION au FTP_DIR. Sur un plan multi-sites, il n'y a pas de public_html
# à la racine du compte : chaque site vit dans domains/<domaine>/public_html.
# Se tromper de chemin écrase le site d'un autre client. Le compte FTP dédié
# à ce site étant cantonné à son propre dossier, FTP_DIR vaut ./
#
# Avant le premier envoi réel, lancer le workflow à la main en laissant
# « essai à blanc » coché : il se connecte et affiche ce qu'il ferait, sans
# rien écrire.
#
# Tant que DEPLOY_FTP n'est pas à "true", le workflow ne fait rien et
# n'échoue pas.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : se connecte, liste ce qui serait envoyé, n'écrit rien"
        type: boolean
        default: true

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_FTP == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Sans PAGES=true : pas de préfixe d'URL (domaine racine), site
      # indexable, et les emplacements réservés ne sont pas rendus.
      - name: Build statique
        run: npm run build

      # Garde-fous : rien ne part si le build ressemble à un aperçu.
      # Les tests d'absence sont écrits en if/then et non en « grep && exit » :
      # un grep qui ne trouve rien renvoie 1, ce qui ferait échouer l'étape
      # dans le cas où tout va bien.
      - name: Contrôles avant envoi
        run: |
          fail() { echo "::error::$1"; exit 1; }

          test -f out/.htaccess   || fail ".htaccess absent du build"
          test -f out/index.html  || fail "index.html absent du build"
          test -f out/sitemap.xml || fail "sitemap.xml absent du build"

          if grep -q 'noindex' out/index.html; then
            fail "le build porte un noindex, c'est un build d'aperçu"
          fi
          if grep -rq 'Emplacement réservé' out/index.html out/*/index.html; then
            fail "un emplacement réservé est visible en production"
          fi
          if grep -q '/aymeric-pataud/_next' out/index.html; then
            fail "préfixe GitHub Pages présent dans un build de production"
          fi

          echo "$(find out -name index.html | wc -l) pages prêtes à partir"

      - name: Envoi FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_DIR }}
          protocol: ftps
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Rappel
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Essai à blanc terminé, rien n'a été écrit sur le serveur. Vérifiez le chemin cible dans le journal ci-dessus avant un envoi réel."
