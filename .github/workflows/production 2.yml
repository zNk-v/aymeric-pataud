name: Production (FTP vers l'hébergement)

# Déploiement du site de production sur www.aymericpataud.fr.
#
# L'hébergement et les DNS restent où ils sont : rien n'est touché côté
# domaine ni côté messagerie. Ce workflow se contente d'envoyer le dossier
# out/ par FTP à la racine web.
#
# ---------------------------------------------------------------------------
# ACTIVATION (à faire une seule fois, dans les réglages du dépôt GitHub)
#
# 1. Settings > Secrets and variables > Actions > Secrets :
#      FTP_SERVER    ex. ftp.cluster0XX.hosting.ovh.net
#      FTP_USERNAME  identifiant FTP
#      FTP_PASSWORD  mot de passe FTP
#
# 2. Settings > Secrets and variables > Actions > Variables :
#      DEPLOY_FTP    true
#      FTP_DIR       chemin de la racine web, avec / final (ex. ./www/)
#
# Tant que DEPLOY_FTP n'est pas à "true", le workflow ne fait rien et
# n'échoue pas.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_FTP == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build statique (sans basePath, pour un domaine racine)
        run: npm run build

      - name: Vérifier que le .htaccess est bien dans le build
        run: test -f out/.htaccess || (echo "::error::.htaccess absent de out/" && exit 1)

      - name: Envoi FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_DIR }}
          protocol: ftps
          # Ne supprime pas les dossiers hérités de WordPress tant que le
          # client n'a pas confirmé qu'ils peuvent partir.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp-content/**
            wp-includes/**
            wp-admin/**
